nodes:
  # Root
  - data:
      id: research-interests
      label: Research Interests
      category: root
      description: My research interests in artificial intelligence, optimization, wireless networking, UAVs, satellites, and quantum computing.

  # Reinforcement Learning
  - data:
      id: reinforcement-learning
      label: Reinforcement Learning
      category: ai
      icon: fa-solid fa-diagram-project
      description: Learning sequential decision-making policies through interactions with an environment.

  - data:
      id: rl
      label: Reinforcement Learning (RL)
      category: ai
      description: Reinforcement learning for autonomous decision-making and control.

  - data:
      id: marl
      label: Multi-Agent Reinforcement Learning (MARL)
      category: ai
      description: Reinforcement learning involving multiple cooperative or competitive agents.

  # Mobile Edge Computing and Wireless Networks
  - data:
      id: mobile-edge-computing
      label: Mobile Edge Computing and Wireless Networks
      category: network
      icon: fa-solid fa-server
      description: Edge computing and wireless communication systems for low-latency and resource-efficient services.

  - data:
      id: mec
      label: Mobile Edge Computing (MEC)
      category: network
      description: Computing infrastructure that places computation and storage resources near network users.

  - data:
      id: edge-caching
      label: Edge Caching
      category: network
      description: Content placement and caching strategies at wireless network edges.

  - data:
      id: urllc
      label: Ultra-Reliable Low-Latency Communication (URLLC)
      category: network
      description: Wireless communication designed for strict reliability and latency requirements.

  - data:
      id: iscc
      label: Integrated Sensing, Communication, and Computation (ISCC)
      category: network
      description: Joint design of sensing, communication, and computational resources.

  # Integrated and Non-Terrestrial Networks
  - data:
      id: integrated-networks
      label: Integrated and Non-Terrestrial Networks
      category: aerospace
      icon: fa-solid fa-satellite-dish
      description: Integrated communication networks combining terrestrial, aerial, maritime, and satellite systems.

  - data:
      id: sagin
      label: Space-Air-Ground Integrated Networks (SAGIN)
      category: aerospace
      description: Integrated networks connecting satellite, aerial, and terrestrial communication systems.

  - data:
      id: sagsin
      label: Space-Air-Ground-Sea Integrated Networks
      category: aerospace
      description: Integrated communication networks spanning space, air, ground, and maritime domains.

  - data:
      id: ntn
      label: Non-Terrestrial Networks (NTN)
      category: aerospace
      description: Communication networks using satellites, high-altitude platforms, and aerial systems.

  # Satellite Communications and Networking
  - data:
      id: satellite-communications
      label: Satellite Communications and Networking
      category: aerospace
      icon: fa-solid fa-satellite
      description: Communication, routing, mobility, and resource management in satellite networks.

  - data:
      id: leo-satellites
      label: LEO Satellites
      category: aerospace
      description: Low Earth orbit satellite communication and networking systems.

  - data:
      id: meo-satellites
      label: MEO Satellites
      category: aerospace
      description: Medium Earth orbit satellite communication and networking systems.

  - data:
      id: geo-satellites
      label: GEO Satellites
      category: aerospace
      description: Geostationary Earth orbit satellite communication systems.

  - data:
      id: satellite-routing
      label: Satellite Routing
      category: aerospace
      description: Routing and path selection in dynamic satellite constellations.

  - data:
      id: satellite-handover
      label: Satellite Handover
      category: aerospace
      description: Mobility and connection management across satellite coverage areas.

  # UAV Systems and Autonomous Operations
  - data:
      id: uav-systems
      label: UAV Systems and Autonomous Operations
      category: aerospace
      icon: fa-solid fa-plane
      description: Autonomous UAV systems for communication, computation, sensing, and control.

  - data:
      id: uav-assisted-mec
      label: UAV-Assisted MEC
      category: aerospace
      description: UAV-based mobile edge computing and computational offloading systems.

  - data:
      id: uav-surveillance
      label: UAV Surveillance
      category: aerospace
      description: Autonomous aerial sensing, monitoring, and surveillance systems.

  - data:
      id: uav-trajectory-control
      label: UAV Trajectory Control
      category: aerospace
      description: Trajectory planning and control for autonomous UAV operations.

  # Advanced AI
  - data:
      id: advanced-ai
      label: Advanced AI
      category: ai
      icon: fa-solid fa-brain
      description: Advanced machine learning models for generation, representation learning, and structured data.

  - data:
      id: generative-ai
      label: Generative AI
      category: ai
      description: Artificial intelligence models that generate data, content, or structured solutions.

  - data:
      id: diffusion-models
      label: Diffusion Models
      category: ai
      description: Generative models based on iterative noise addition and denoising processes.

  - data:
      id: gnn
      label: Graph Neural Networks (GNNs)
      category: ai
      description: Neural networks designed to learn representations from graph-structured data.

  # Embodied and Physical AI
  - data:
      id: embodied-physical-ai
      label: Embodied and Physical AI
      category: ai
      icon: fa-solid fa-robot
      description: AI systems that perceive, reason, and act within physical or simulated environments.

  - data:
      id: physical-ai
      label: Physical AI
      category: ai
      description: Artificial intelligence integrated with physical systems, robots, and autonomous agents.

  - data:
      id: vla
      label: Vision-Language-Action Models (VLA)
      category: ai
      description: Multimodal models connecting visual perception, language understanding, and physical actions.

  - data:
      id: digital-twins
      label: Digital Twins
      category: ai
      description: Virtual representations of physical systems for simulation, monitoring, and control.

  - data:
      id: world-model
      label: World Models
      category: ai
      description: Learned internal models that represent and predict environment dynamics.

  # Quantum AI
  - data:
      id: quantum-ai
      label: Quantum AI
      category: quantum
      icon: fa-solid fa-atom
      description: Artificial intelligence methods using quantum computation and quantum information processing.

  - data:
      id: qml
      label: Quantum Machine Learning (QML)
      category: quantum
      description: Machine learning algorithms implemented with classical-quantum or fully quantum models.

  - data:
      id: qfl
      label: Quantum Federated Learning (QFL)
      category: quantum
      description: Federated learning systems incorporating quantum models or quantum computation.

  - data:
      id: qrl
      label: Quantum Reinforcement Learning (QRL)
      category: quantum
      description: Reinforcement learning using quantum models, quantum circuits, or quantum optimization.

  # Optimization Theory
  - data:
      id: optimization-theory
      label: Optimization Theory
      category: optimization
      icon: fa-solid fa-calendar-check
      description: Mathematical optimization methods for resource allocation, control, scheduling, and decision-making.

  - data:
      id: lyapunov-optimization
      label: Lyapunov Optimization
      category: optimization
      description: Online stochastic optimization using Lyapunov drift and queue stability analysis.

  - data:
      id: lagrangian-optimization
      label: Lagrangian Optimization
      category: optimization
      description: Constrained optimization using Lagrange multipliers and dual decomposition.

  - data:
      id: game-theory
      label: Game Theory
      category: optimization
      description: Strategic decision-making among cooperative or competitive agents.

  - data:
      id: auction-based-optimization
      label: Auction-Based Optimization
      category: optimization
      description: Distributed resource allocation and decision-making using auction mechanisms.

  - data:
      id: sca
      label: Successive Convex Approximation (SCA)
      category: optimization
      description: Iterative optimization of non-convex problems using convex approximations.

  - data:
      id: qubo
      label: Quadratic Unconstrained Binary Optimization (QUBO)
      category: optimization
      description: Binary optimization formulation commonly used in quantum and combinatorial optimization.

